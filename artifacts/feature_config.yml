# Version-controlled analytical configuration.
# Models and features must read from this file, never hard-code these values.

dataset:
  source: statsbomb-open-data
  competition_id: 2        # Premier League
  season_id: 27            # 2015/2016
  competition_name: Premier League
  season_name: "2015/2016"
  # Why: only complete men's league season in the open data with full event
  # depth (pressures, xG, freeze frames). Chosen after auditing all
  # competition-seasons — see docs/data_audit.csv.

thresholds:
  min_minutes_season: 600      # below this, per-90 season metrics are null
  low_minutes_warning: 900     # between min and this, results carry a warning
  min_pass_attempts_for_rate: 100
  min_shots_for_rate: 20
  min_dribbles_for_rate: 20
  min_aerials_for_rate: 20
  min_att_half_touches_for_share: 100

role_groups:
  # Broad outfield roles for the MVP; goalkeepers are excluded.
  - key: CB
    name: Centre-backs
  - key: FB
    name: Full-backs / wing-backs
  - key: CM
    name: Central midfielders
  - key: AM_W
    name: Attacking midfielders / wingers
  - key: ST
    name: Strikers

similarity:
  # Winsorize at these percentiles (within role) before standardizing, so a
  # single extreme season cannot dominate the distance. Raw values are always
  # what the user sees.
  winsorize_lower: 0.01
  winsorize_upper: 0.99
  # A candidate must have at least this share of its role's features present,
  # otherwise it is excluded (too little data to compare fairly).
  min_feature_coverage: 0.7

# Role-specific feature lists and similarity weights.
# Weight scale: 1.0 = normal importance, >1 = defining for the role, <1 = minor.
# These are analytical choices — edit them here, never in code.
role_features:
  CB:
    # Defensive volume, aerial dominance and line height define a centre-back;
    # passing and progression separate ball-players from pure stoppers.
    padj_tackles_p90: 1.5
    padj_interceptions_p90: 1.5
    blocks_p90: 1.2
    recoveries_p90: 1.0
    padj_pressures_p90: 1.0
    def_action_height: 1.5
    aerial_involvement_p90: 1.5
    aerial_win_pct: 1.5
    pass_attempts_p90: 1.2
    pass_completion_pct: 1.2
    forward_pass_share: 1.2
    long_pass_share: 1.2
    prog_passes_p90: 1.5
    prog_carries_p90: 1.2
    turnovers_p90: 0.8

  FB:
    # Where a full-back operates (wide vs inverted) and how they deliver the
    # ball matter as much as their defending.
    wide_touch_share: 1.5
    halfspace_touch_share: 1.5
    crosses_box_p90: 1.5
    prog_carries_p90: 1.5
    prog_passes_p90: 1.2
    final_third_entries_p90: 1.2
    box_entries_p90: 1.2
    key_passes_p90: 1.0
    padj_tackles_p90: 1.2
    padj_interceptions_p90: 1.2
    padj_pressures_p90: 1.0
    recoveries_p90: 0.8
    def_action_height: 1.2
    pass_attempts_p90: 1.0
    pass_completion_pct: 1.0
    forward_pass_share: 1.0
    dribble_success_pct: 1.0
    aerial_involvement_p90: 0.8
    turnovers_p90: 0.8

  CM:
    # Passing volume and progression, plus defensive workrate, separate holders
    # from box-to-box runners from deep playmakers.
    pass_attempts_p90: 1.5
    pass_completion_pct: 1.2
    forward_pass_share: 1.2
    long_pass_share: 1.0
    prog_passes_p90: 1.5
    prog_carries_p90: 1.2
    final_third_entries_p90: 1.2
    box_entries_p90: 1.0
    key_passes_p90: 1.2
    xg_assisted_p90: 1.0
    through_balls_p90: 0.8
    zone14_receptions_p90: 1.2
    zone14_entries_p90: 1.0
    padj_pressures_p90: 1.5
    padj_tackles_p90: 1.5
    padj_interceptions_p90: 1.2
    recoveries_p90: 1.2
    def_action_height: 1.2
    shots_p90: 0.8
    npxg_p90: 0.8
    aerial_involvement_p90: 0.8
    pressured_actions_share: 1.0
    turnovers_p90: 1.0

  AM_W:
    # Creation, carrying and shot volume, plus where they occupy space —
    # touchline winger vs inverted forward vs central playmaker.
    key_passes_p90: 1.5
    xg_assisted_p90: 1.5
    crosses_box_p90: 1.2
    through_balls_p90: 1.0
    prog_carries_p90: 1.5
    dribble_success_pct: 1.2
    box_entries_p90: 1.2
    final_third_entries_p90: 1.0
    shots_p90: 1.5
    npxg_p90: 1.5
    box_shot_share: 1.0
    npxg_per_shot: 1.0
    zone14_receptions_p90: 1.5
    halfspace_touch_share: 1.5
    wide_touch_share: 1.5
    receptions_final_third_p90: 1.2
    touches_att_third_share: 1.0
    pass_completion_pct: 0.8
    forward_pass_share: 0.8
    padj_pressures_p90: 1.0
    turnovers_p90: 0.8

  ST:
    # Shot profile and aerial presence dominate; link play and pressing
    # separate target men, poachers and pressing forwards.
    npxg_p90: 1.8
    shots_p90: 1.5
    box_shot_share: 1.5
    npxg_per_shot: 1.5
    aerial_involvement_p90: 1.5
    aerial_win_pct: 1.2
    key_passes_p90: 1.2
    xg_assisted_p90: 1.2
    prog_carries_p90: 1.2
    dribble_success_pct: 1.0
    zone14_receptions_p90: 1.2
    receptions_final_third_p90: 1.2
    box_entries_p90: 1.0
    pass_completion_pct: 1.0
    forward_pass_share: 0.8
    padj_pressures_p90: 1.2
    pressured_actions_share: 1.0
    turnovers_p90: 0.8
