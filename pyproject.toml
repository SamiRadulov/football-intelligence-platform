[project]
name = "football-intelligence-platform"
version = "0.1.0"
description = "Player recruitment similarity and team playing-style classification on StatsBomb Open Data"
authors = [{ name = "Samuil Radulov" }]
requires-python = ">=3.12"
dependencies = [
    "statsbombpy>=1.14",
    "pandas>=2.2",
    "requests>=2.31",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "streamlit>=1.38",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
